[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DATABASE URL is set in alembic/env.py from settings.DATABASE_URL (loaded from .env)
# The value here is a fallback placeholder only — the env.py override takes precedence.
sqlalchemy.url = postgresql://localhost/bloodlink

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
