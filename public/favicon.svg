<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="16" y1="6" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="linkGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7F1D1D" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Blood Drop Shape -->
  <path d="M32 4 C32 4 12 28 12 40 C12 51.0457 20.9543 60 32 60 C43.0457 60 52 51.0457 52 40 C52 28 32 4 32 4 Z"
        fill="url(#dropGrad)"
        filter="url(#shadow)" />

  <!-- Interlocking Connection / Cross Plus Node -->
  <circle cx="32" cy="40" r="11" stroke="url(#linkGrad)" stroke-width="3" fill="none" opacity="0.85" />
  <path d="M32 34 V46 M26 40 H38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Pulse Line Accent -->
  <path d="M22 40 L28 40 L30 36 L33 44 L36 38 L38 40 L42 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Gloss Highlight -->
  <path d="M22 28 C20 33 20 38 22 42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
</svg>
